# GitHub Pages 배포 — main에 push하면 테스트 → 브라우저 전용 빌드로 게스트 흐름 시험 → 정적 빌드(out/) → 브라우저 자동 시험(같은 out/) → Pages 배포.
# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions" 로 한 번 설정해야 한다.
# 매일 한 번(schedule) 같은 길(테스트 → 유튜브·운동 영상 목록·지원사업 수집 → 빌드 → e2e → 배포)을 다시 돌아 운동 탭 "유튜브 추천 영상",
# 빌드에 싣는 운동 영상 목록(scripts/videos-fetch.mjs), 지원사업 화면의 "우리 지역 지원사업"을 새로 만든다.
# schedule은 기본 브랜치(main)의 최신 커밋으로 돈다 — 아래 두 job 모두 이벤트 조건이 없어 push와 똑같이 배포까지 간다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매일 18:30 UTC = 한국 시간 새벽 3:30. GitHub가 몇 분~수십 분 늦게 시작할 수 있다.
    - cron: "30 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 공개 사이트 모드 — server(카카오 로그인·서버 저장 켬) | browser(브라우저 전용, 서버 없음).
# 2026-10-24 CPO 결정: 로그인을 켠 시범 공개(server). 지도·유튜브는 각자의 값이 없어 꺼진 채다. 검색 노출은 계속 막힌다(noindex).
# 끄려면 ONMOM_SITE_MODE를 browser로 바꿔 커밋하면 다음 배포부터 지금까지의 브라우저 전용으로 돌아간다.
# GitHub Variables에 NEXT_PUBLIC_SUPABASE_URL·NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY가 있으면 그 값이 아래 기본값보다 우선한다.
# 아래 두 값은 공개값이다(로그인을 켠 사이트의 번들에 그대로 들어간다). secret·service_role 키는 절대 여기에 두지 않는다.
env:
  ONMOM_SITE_MODE: server
  ONMOM_SUPABASE_URL: https://movrwmoniopgetdmagon.supabase.co
  ONMOM_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zjE7s6XlBylAPVqt47QaqQ_L5R7Pcvn
  # 매일 리마인더 — on이면 Variable NEXT_PUBLIC_VAPID_PUBLIC_KEY를 빌드에 넣어 설정 > 알림을 켠다. off면 "준비 중".
  # 서버 예약 값(Vault: reminder_cron_secret·project_url·publishable_key)이 없으면 구독만 모이고 알림은 가지 않으므로,
  # Vault를 다시 넣은 뒤에 on으로 바꾼다(docs/PWA_AND_REMINDERS.md §5). 2026-10-24: Vault 비어 있음 → off.
  ONMOM_REMINDERS: off
  # AI 상담 화면 스위치 — on이면 빌드에 NEXT_PUBLIC_AI_CHAT_ENABLED=true를 넣는다(2026-11-06 대표 결정: 켠다 — 상담에만, 시범 동안 카카오 계정만).
  # GitHub Variable NEXT_PUBLIC_AI_CHAT_ENABLED가 있으면 그 값이 먼저다(false로 두면 끈다). off로 바꿔 커밋해도 끈다.
  # 서버 쪽 스위치는 따로다(supabase.yml ONMOM_AI_CHAT_SERVER_ENABLED) — 둘 다 켜져야 AI가 답한다. 따옴표: YAML 1.1 도구가 on을 true로 읽지 않게.
  ONMOM_AI: "on"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      # 이 사이트가 실제로 열리는 주소(configure-pages의 base_url) + 끝 슬래시 — 공유 미리보기(OG)의 절대 주소로 쓴다.
      # 저장소 Settings → Pages에 커스텀 도메인을 넣으면 base_url은 그 도메인, base_path는 ""가 되어 둘이 늘 함께 바뀐다
      # (src/config.ts siteUrlFrom은 경로가 BASE_PATH와 다르면 빌드를 멈춘다). 인증서가 나오기 전에는 http로 오므로 https로 바꾼다.
      - name: Site URL
        id: site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$BASE_URL" ]; then url="https://${BASE_URL#*://}"; url="${url%/}/"; else url=""; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "사이트 주소: ${url:-(기본값)}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 유튜브 추천 영상(scripts/youtube-fetch.mjs) — 승인된 채널·영상(src/content/youtube-allowlist.json)의 공개 메타데이터를
      # YouTube Data API v3로 읽어 src/content/youtube.generated.json을 쓴다. 키는 이 단계에만 넘긴다(빌드 단계·브라우저 번들에는 없다 —
      # NEXT_PUBLIC_이 아니고, 스크립트는 요청 헤더로만 보내며 출력·파일에 쓰지 않는다).
      # 저장소 Settings → Secrets and variables → Actions → Secrets 에 YOUTUBE_API_KEY(YouTube Data API v3만 허용한 API 키).
      # 키가 없거나 허용 목록이 비었으면 아무것도 하지 않고(요청 0), API가 실패하면 HTTP 상태만 남기고 빈 목록을 써서 유튜브 목록 없이 배포한다.
      # 허용 목록 형식이 틀리면 여기서 멈춘다(빌드도 같은 검사로 멈춘다).
      - name: Fetch approved YouTube videos
        run: node scripts/youtube-fetch.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # 운동 영상 목록(scripts/videos-fetch.mjs) — Edge Function videos가 부르는 그 영상 서버(VIDEO_API_URL)에서 두 분만 경로의 목록을
      # 받아 src/content/videos.generated.json을 쓴다. 목록이 실린 빌드는 운동·분석 화면에서 영상 서버·함수를 부르지 않는다
      # (잠든 Render 서버를 기다리지 않고, 분만 방식이 기기 밖으로 나가지 않는다). 요청마다 60초, 실패하면 한 번 더(잠든 서버 깨우기).
      # 늘 성공으로 끝난다: VIDEO_API_URL이 없거나 서버가 끝내 실패하면 빈 목록을 쓰고 경고(annotation)만 남긴다 — 그 빌드는 지금처럼 함수에 묻는다.
      # 값은 Variable(공개값 — supabase.yml이 함수 비밀값으로 넣는 것과 같은 VIDEO_API_URL)이고 이 단계에만 넘긴다. 아래 두 빌드가 같은 목록을 싣는다.
      # Variable이 없으면 함수와 같은 기본 주소(_shared/videos.ts DEFAULT_VIDEO_API_URL)를 쓴다 — 두 곳이 늘 같은 서버를 본다.
      # --disable-warning: package.json에 "type"이 없어 Node가 .ts를 불러올 때마다 내는 모듈 형식 경고만 끈다.
      - name: Fetch exercise video list
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/videos-fetch.mjs
        env:
          VIDEO_API_URL: ${{ vars.VIDEO_API_URL || 'https://hackathon-video-api.onrender.com' }}
      # 우리 지역 지원사업(scripts/support-fetch.mjs) — 행정안전부_대한민국 공공서비스(혜택) 정보(공공데이터포털 15113968,
      # api.odcloud.kr serviceList)에서 임신·출산 사업(개인·가구 대상)만 골라 public/support-programs.json(지원사업 화면이 지역을 고를 때 받는 정적 파일)과
      # src/content/support-programs.generated.json(기준일·개수·해시)을 쓴다. 브라우저는 공공데이터포털을 부르지 않는다(같은 사이트의 파일만 — CSP 그대로).
      # 키는 이 단계에만 넘긴다(빌드 단계·브라우저 번들에는 없다 — NEXT_PUBLIC_이 아니고, 스크립트는 요청 주소를 출력·파일에 쓰지 않는다).
      # 저장소 Settings → Secrets and variables → Actions → Secrets 에 DATA_GO_KR_SERVICE_KEY(공공데이터포털 일반 인증키 — Decoding 값 권장).
      # 키가 없으면 요청 없이 빈 표시를 써서 이 기능 없이 배포하고, API가 실패하면 경고(::warning::) 한 줄을 남기고 같은 식으로 배포를 잇는다.
      - name: Fetch regional support programs
        run: node scripts/support-fetch.mjs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      # 브라우저 자동 시험(e2e, docs/DEV_NOTES.md §11)은 두 번 돈다. 하나라도 실패하면 이 job이 실패해 아래 업로드·deploy job이 돌지 않는다.
      # ① 같은 코드를 Supabase 값 없이(브라우저 전용) 빌드해 게스트 흐름 전체(온보딩 → 위험 신호 → 404 → 계정 삭제)를 시험한다 —
      #    서버 모드 빌드에서는 게스트 시작이 운영 서버에 익명 계정을 만들므로 그 시험이 건너뛰어진다(e2e/guest-flow.spec.ts).
      # ② 아래 Build가 out/을 배포할 빌드로 덮어쓰고, 그 out/(배포할 그 파일)을 같은 BASE_PATH로 띄워 다시 연다.
      # Chromium(폰·PC·글자 150%·Android 흉내) + WebKit(iPhone Safari 흉내 — playwright.config.ts의 iphone 프로젝트). WebKit은 시스템 라이브러리까지.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps --only-shell chromium webkit
      - name: Build (browser-only, for e2e)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.site.outputs.url }}
      # 전부(게스트 흐름 + 접근성 axe + 글자 150%·확대·320px + 관리자 대시보드 + iPhone WebKit·Android 흉내)
      - name: Browser smoke tests (browser-only build)
        run: npm run e2e:run
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Build
        run: npm run build
        env:
          # 프로젝트 페이지면 "/onmom_web", 커스텀 도메인을 연결하면 "" (configure-pages가 알려준다)
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 공개값만 — 정적 사이트 번들에 그대로 들어간다. 저장소 Settings → Secrets and variables → Actions → Variables 에서 관리.
          NEXT_PUBLIC_VIDEO_URL: ${{ vars.NEXT_PUBLIC_VIDEO_URL }}
          NEXT_PUBLIC_LLM_URL: ${{ vars.NEXT_PUBLIC_LLM_URL }}
          NEXT_PUBLIC_ACCOUNT_URL: ${{ vars.NEXT_PUBLIC_ACCOUNT_URL }}
          NEXT_PUBLIC_ONMOM_APP_KEY: ${{ vars.NEXT_PUBLIC_ONMOM_APP_KEY }}
          # 카카오 JavaScript 키(공개값) — 가까운 산부인과 지도. 카카오 콘솔의 JavaScript SDK 도메인으로 사용처가 제한된다.
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
          # 사용자 관리·카카오 로그인·서버 저장·영상/AI 프록시(Supabase, docs/SUPABASE_SETUP.md). URL·키 둘 다 있어야 켜진다.
          # 비어 있으면 지금처럼 브라우저에만 저장하는 게스트로 동작한다.
          # PUBLISHABLE_KEY는 공개 키(sb_publishable_… 또는 anon)만. secret·service_role 키는 절대 넣지 않는다(넣으면 빌드가 멈춘다).
          # 값을 고르는 순서: GitHub Variables → (ONMOM_SITE_MODE가 server면) 위 기본값 → 빈 값(브라우저 전용).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || (env.ONMOM_SITE_MODE == 'server' && env.ONMOM_SUPABASE_URL || '') }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || (env.ONMOM_SITE_MODE == 'server' && env.ONMOM_SUPABASE_PUBLISHABLE_KEY || '') }}
          # Cloudflare Turnstile 사이트 키(공개값) — Supabase의 CAPTCHA를 켤 때만. 비밀 키는 Supabase 대시보드에만.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # AI 상담 화면 스위치 — "true"일 때만 웹이 함수 chat을 부른다. 값을 고르는 순서: GitHub Variable → (ONMOM_AI가 on이면) true → 빈 값(꺼짐).
          # Supabase 값이 없는 빌드(ONMOM_SITE_MODE=browser)에서는 뜻이 없다(src/config.ts isLLMBackendConfigured).
          NEXT_PUBLIC_AI_CHAT_ENABLED: ${{ vars.NEXT_PUBLIC_AI_CHAT_ENABLED || (env.ONMOM_AI == 'on' && 'true' || '') }}
          # 매일 리마인더(웹 푸시)의 VAPID 공개 키(공개값) — scripts/generate-vapid.mjs가 출력한 한 쌍 중 공개 키만. 비밀 키는 Supabase 함수
          # 비밀값(VAPID_PRIVATE_KEY)에만. Supabase 값과 함께 있어야 설정 > 알림 토글이 켜진다(docs/PWA_AND_REMINDERS.md). 형식이 틀리면 빌드가 멈춘다.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ env.ONMOM_REMINDERS == 'on' && vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          # 검색 노출 스위치 하나 — "true"면 시작 주소(/)·처리방침(/privacy/)·약관(/terms/)만 색인 허용(화면 메타 index, robots.txt의 Allow,
          # sitemap.xml에 그 절대 주소 — 아래 NEXT_PUBLIC_SITE_URL 기준), 나머지는 계속 noindex. 비우면 전부 noindex + robots.txt Disallow: / + 빈 sitemap(1.0 공개 전).
          # 목록은 src/config.ts SEARCH_INDEX_ROUTES, robots.txt·sitemap.xml은 빌드 때 src/app/robots.ts·sitemap.ts가 만든다(docs/SECURITY.md §5).
          NEXT_PUBLIC_SITE_INDEXABLE: ${{ vars.NEXT_PUBLIC_SITE_INDEXABLE }}
          # 공유 미리보기(OG)의 절대 주소 — Variable이 없으면 위 "Site URL" 단계의 Pages 주소(커스텀 도메인을 넣으면 https://<도메인>/).
          # Variable을 넣으면 그 값이 우선한다(경로가 BASE_PATH와 다르면 빌드가 멈춘다 — src/config.ts siteUrlFrom, docs/PWA_AND_REMINDERS.md §2-3).
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.site.outputs.url }}
      # 배포할 빌드 — 폰·PC만(게스트 상태를 쓰는 시험은 서버 모드라 어차피 건너뛰고, 글자 크기·기기 흉내는 ① 브라우저 전용 빌드에서 이미 봤다)
      - name: Browser smoke tests (deploy build)
        run: npm run e2e:run -- --project=phone --project=desktop
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
