# GitHub Pages 배포 — main에 push하면 테스트 → 정적 빌드(out/) → 브라우저 자동 시험(같은 out/) → Pages 배포.
# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions" 로 한 번 설정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # 프로젝트 페이지면 "/onmom_web", 커스텀 도메인을 연결하면 "" (configure-pages가 알려준다)
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 공개값만 — 정적 사이트 번들에 그대로 들어간다. 저장소 Settings → Secrets and variables → Actions → Variables 에서 관리.
          NEXT_PUBLIC_VIDEO_URL: ${{ vars.NEXT_PUBLIC_VIDEO_URL }}
          NEXT_PUBLIC_LLM_URL: ${{ vars.NEXT_PUBLIC_LLM_URL }}
          NEXT_PUBLIC_ACCOUNT_URL: ${{ vars.NEXT_PUBLIC_ACCOUNT_URL }}
          NEXT_PUBLIC_ONMOM_APP_KEY: ${{ vars.NEXT_PUBLIC_ONMOM_APP_KEY }}
          # 카카오 JavaScript 키(공개값) — 가까운 산부인과 지도. 카카오 콘솔의 JavaScript SDK 도메인으로 사용처가 제한된다.
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
          # 사용자 관리·카카오 로그인·서버 저장·영상/AI 프록시(Supabase, docs/SUPABASE_SETUP.md). URL·키 둘 다 있어야 켜진다.
          # 비어 있으면 지금처럼 브라우저에만 저장하는 게스트로 동작한다.
          # PUBLISHABLE_KEY는 공개 키(sb_publishable_… 또는 anon)만. secret·service_role 키는 절대 넣지 않는다(넣으면 빌드가 멈춘다).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Cloudflare Turnstile 사이트 키(공개값) — Supabase의 CAPTCHA를 켤 때만. 비밀 키는 Supabase 대시보드에만.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # AI 상담 켜기 — "true"일 때만. Edge Function 비밀값 ANTHROPIC_API_KEY와 CPO·법률 승인(docs/LAUNCH_CHECKLIST.md)이 먼저.
          NEXT_PUBLIC_AI_CHAT_ENABLED: ${{ vars.NEXT_PUBLIC_AI_CHAT_ENABLED }}
          # 매일 리마인더(웹 푸시)의 VAPID 공개 키(공개값) — scripts/generate-vapid.mjs가 출력한 한 쌍 중 공개 키만. 비밀 키는 Supabase 함수
          # 비밀값(VAPID_PRIVATE_KEY)에만. Supabase 값과 함께 있어야 설정 > 알림 토글이 켜진다(docs/PWA_AND_REMINDERS.md). 형식이 틀리면 빌드가 멈춘다.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          # 검색 노출 — "true"면 서비스 소개(/)만 색인 허용, 나머지는 계속 noindex. 비우면 전부 noindex(1.0 공개 전).
          # src/app/page.tsx가 robotsFor("landing")을 쓰는 빌드에서만 효과가 있다(docs/PWA_AND_REMINDERS.md §8).
          NEXT_PUBLIC_SITE_INDEXABLE: ${{ vars.NEXT_PUBLIC_SITE_INDEXABLE }}
      # 브라우저 자동 시험(e2e, docs/DEV_NOTES.md §11) — 방금 만든 out/(배포할 그 파일)을 같은 BASE_PATH로 띄워 폰·PC Chromium으로 연다.
      # 실패하면 이 job이 실패해 아래 업로드·deploy job이 돌지 않는다.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser smoke tests (e2e)
        run: npm run e2e:run
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
