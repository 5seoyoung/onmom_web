# Supabase 배포 — DB 표(마이그레이션) → Edge Function 비밀값 → Edge Function(videos·chat·send-reminders) 배포.
# 설명서: docs/SUPABASE_SETUP.md (D단계). 웹 사이트 배포는 deploy.yml이 따로 한다.
#
# 필요한 값 — 저장소 Settings → Secrets and variables → Actions
#   Secrets:   SUPABASE_ACCESS_TOKEN(필수) · SUPABASE_DB_PASSWORD(필수) · ANTHROPIC_API_KEY(AI 상담을 켤 때)
#              VAPID_PRIVATE_KEY · VAPID_SUBJECT · REMINDER_CRON_SECRET(매일 리마인더를 켤 때 — docs/PWA_AND_REMINDERS.md §5)
#   Variables: SUPABASE_PROJECT_REF(필수) · VIDEO_API_URL · ALLOWED_ORIGINS · CHAT_HOURLY_LIMIT · CHAT_GLOBAL_DAILY_LIMIT
#              ANTHROPIC_WORKSPACE_ID(조직 전체용 Anthropic 키일 때 — wrkspc_…, Secrets에 넣어도 읽는다)
#              NEXT_PUBLIC_VAPID_PUBLIC_KEY(사이트 빌드와 같은 값 — 함수 비밀값 VAPID_PUBLIC_KEY로 넣어 비밀 키와 짝이 맞는지 함수가 확인)
# 매일 리마인더는 이 워크플로만으로 켜지지 않는다 — 마지막에 Supabase SQL Editor에서 Vault reminder_cron_secret을 넣어야 예약이 함수를 부른다
# (docs/PWA_AND_REMINDERS.md §5 E). 그 전에는 0004의 예약이 돌아도 요청을 만들지 않는다.
# 비어 있는 선택 값은 건너뛴다(서버에 이미 있던 값은 그대로 남고, 없으면 함수 기본값 — supabase/functions/_shared).
#
# 하지 않는 것: 인증(Auth) 설정 올리기(`supabase config push`) — 인증 설정은 대시보드가 기준이다(supabase/config.toml 참고).
#              비밀값 지우기 — 비운 값은 건너뛸 뿐이다. 서버에서 지우려면 Supabase 대시보드 → Edge Functions → Secrets(설명서 G).
# 비밀값은 로그에 찍지 않는다: set -x 금지, 명령 인자로 넘기지 않고(파일로), 값 대신 이름만 출력한다.
# 운영 DB·함수를 바꾸므로 main에서만 돈다(Run workflow에서 다른 브랜치를 골라도 건너뜀). 테스트(npm test)가 통과해야 배포한다.
name: Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 운영 프로젝트에 db push·함수 배포를 하므로 main에서만 — Run workflow에서 다른 브랜치를 고르면 이 작업은 건너뛴다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 뒤 단계(Supabase CLI)가 GITHUB_TOKEN을 .git/config에서 읽을 수 없게 한다 — 이 작업은 저장소에 쓰지 않는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 설정 확인
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          CHAT_HOURLY_LIMIT: ${{ vars.CHAT_HOURLY_LIMIT }}
          CHAT_GLOBAL_DAILY_LIMIT: ${{ vars.CHAT_GLOBAL_DAILY_LIMIT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing+=("Secrets → SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD}" ] || missing+=("Secrets → SUPABASE_DB_PASSWORD")
          [ -n "${SUPABASE_PROJECT_REF}" ] || missing+=("Variables → SUPABASE_PROJECT_REF")

          # 아직 아무것도 넣지 않았는데 main push로 돌았으면 조용히 건너뛴다(사이트는 지금처럼 브라우저 저장만).
          # 직접 실행(Run workflow)했거나 일부만 넣었으면 무엇이 빠졌는지 알리고 실패한다.
          if [ "${#missing[@]}" -eq 3 ] && [ "${EVENT_NAME}" = "push" ]; then
            echo "::notice title=Supabase 배포 건너뜀::아직 Supabase 값이 없습니다. docs/SUPABASE_SETUP.md C단계를 마친 뒤 Actions → Supabase → Run workflow로 실행하세요."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error title=값이 없습니다::저장소 Settings → Secrets and variables → Actions → ${m} 를 넣어 주세요 (docs/SUPABASE_SETUP.md C단계)."
            done
            exit 1
          fi

          ref="${SUPABASE_PROJECT_REF//[[:space:]]/}"
          if ! [[ "${ref}" =~ ^[a-z]{20}$ ]]; then
            echo "::error title=SUPABASE_PROJECT_REF 형식::영문 소문자 20자여야 합니다(주소 https://<이 값>.supabase.co 의 가운데 부분). 주소 전체나 공백을 넣지 않았는지 확인하세요."
            exit 1
          fi

          # 웹이 부르는 Edge Function의 CORS 허용 주소(공개값). 비우면 함수의 기본값(배포 사이트·localhost:3000)을 쓴다.
          # 함수는 항목마다 "https://호스트"만 떼어 쓰고 알아볼 수 없는 항목은 버린다 — 모두 버려지면 웹 요청이 전부 막히므로 여기서 미리 거른다.
          if [ -n "${ALLOWED_ORIGINS//[[:space:]]/}" ]; then
            IFS=',' read -r -a origins <<< "${ALLOWED_ORIGINS}"
            for o in "${origins[@]}"; do
              o="${o//[[:space:]]/}"
              [ -z "${o}" ] && continue
              if ! [[ "${o}" =~ ^https?://[^/?#]+(/.*)?$ ]]; then
                echo "::error title=ALLOWED_ORIGINS 형식::'${o}' — https://5seoyoung.github.io 처럼 http(s)://로 시작해야 하고, 여러 개는 쉼표로 나눕니다."
                exit 1
              fi
            done
          fi

          # AI 상담 요청 한도(선택) — 한 사람의 1시간 요청 수(1~1000), 전체 하루 요청 수. 비우면 함수 기본값(supabase/functions/_shared/chat.ts).
          for name in CHAT_HOURLY_LIMIT CHAT_GLOBAL_DAILY_LIMIT; do
            v="${!name:-}"
            v="${v//[[:space:]]/}"
            if [ -n "${v}" ] && ! [[ "${v}" =~ ^[1-9][0-9]{0,6}$ ]]; then
              echo "::error title=${name} 형식::1 이상의 정수만 넣습니다(쉼표·단위 없이, 예: 30)."
              exit 1
            fi
          done

          # Anthropic 워크스페이스(선택) — 조직 전체용 키는 요청마다 워크스페이스를 지정해야 한다(chat/index.ts anthropic-workspace-id).
          wsid="${ANTHROPIC_WORKSPACE_ID//[[:space:]]/}"
          if [ -n "${wsid}" ] && ! [[ "${wsid}" =~ ^wrkspc_[A-Za-z0-9]+$ ]]; then
            echo "::error title=ANTHROPIC_WORKSPACE_ID 형식::Anthropic 콘솔 Settings → Workspaces의 ID(wrkspc_로 시작)를 그대로 넣습니다."
            exit 1
          fi

          # 매일 리마인더(선택) — 형식만 본다(값은 찍지 않는다). 비어 있으면 건너뛴다(리마인더는 꺼진 채).
          # 비밀 키: scripts/generate-vapid.mjs의 비밀 키(base64url 43자). 공개 키(87자)를 잘못 넣는 실수를 막는다.
          vpriv="${VAPID_PRIVATE_KEY//[[:space:]]/}"
          if [ -n "${vpriv}" ] && ! [[ "${vpriv}" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error title=VAPID_PRIVATE_KEY 형식::scripts/generate-vapid.mjs가 출력한 비밀 키(43자)를 그대로 넣습니다. 공개 키(87자)를 넣지 않았는지 확인하세요."
            exit 1
          fi
          vpub="${VAPID_PUBLIC_KEY//[[:space:]]/}"
          if [ -n "${vpub}" ] && ! [[ "${vpub}" =~ ^B[A-Za-z0-9_-]{86}$ ]]; then
            echo "::error title=NEXT_PUBLIC_VAPID_PUBLIC_KEY 형식::공개 키는 87자, B로 시작합니다(scripts/generate-vapid.mjs)."
            exit 1
          fi
          vsub="${VAPID_SUBJECT//[[:space:]]/}"
          if [ -n "${vsub}" ] && ! [[ "${vsub}" =~ ^(mailto:[^@]+@[^@]+|https://[^/]+.*)$ ]]; then
            echo "::error title=VAPID_SUBJECT 형식::mailto:<운영 이메일> 또는 https://… 주소여야 합니다."
            exit 1
          fi
          rsec="${REMINDER_CRON_SECRET//[[:space:]]/}"
          if [ -n "${rsec}" ] && [ "${#rsec}" -lt 16 ]; then
            echo "::error title=REMINDER_CRON_SECRET 길이::16자 이상이어야 합니다(예: openssl rand -hex 32)."
            exit 1
          fi

          for fn in videos chat send-reminders; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "::error title=함수 파일 없음::supabase/functions/${fn}/index.ts 가 저장소에 없습니다."
              exit 1
            fi
          done

          echo "project_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # 테스트 관문 — 규칙·Edge Function 처리 테스트(src/api/edgeFunctions·edgeHandlers 포함)가 통과해야 DB·함수를 바꾼다.
      # 실패하면 뒤 단계는 모두 건너뛴다(각 단계의 if에는 success()가 암묵적으로 붙는다).
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: 테스트
        if: steps.check.outputs.run == 'true'
        run: |
          npm ci
          npm test

      # 제3자 액션은 커밋으로 고정한다(태그는 옮길 수 있다) — 이 액션이 설치한 CLI가 계정 전체 토큰(SUPABASE_ACCESS_TOKEN)을 받는다.
      # 올릴 때: git ls-remote --tags https://github.com/supabase/setup-cli.git 로 새 태그의 커밋을 확인해 두 줄을 함께 바꾼다.
      # CLI 버전도 고정한다 — 새 버전은 이 줄을 바꿔 한 번 돌려 보고 올린다.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.check.outputs.run == 'true'
        with:
          version: 2.117.0

      - name: 프로젝트 연결
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: DB 표 만들기·고치기 (supabase/migrations)
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # 서버에 아직 적용하지 않은 파일만 번호 순서로 적용한다(이미 적용한 번호는 건너뜀).
        run: |
          set -euo pipefail
          ls -1 supabase/migrations
          supabase db push --linked --yes

      - name: Edge Function 비밀값 넣기
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_API_URL: ${{ vars.VIDEO_API_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          CHAT_HOURLY_LIMIT: ${{ vars.CHAT_HOURLY_LIMIT }}
          CHAT_GLOBAL_DAILY_LIMIT: ${{ vars.CHAT_GLOBAL_DAILY_LIMIT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          # 값은 명령 인자(다른 프로세스가 볼 수 있음)가 아니라 이 단계에서만 읽을 수 있는 임시 파일로 넘기고 바로 지운다.
          umask 077
          envfile="$(mktemp)"
          trap 'rm -f "${envfile}"' EXIT
          names=()
          for name in ANTHROPIC_API_KEY ANTHROPIC_WORKSPACE_ID VIDEO_API_URL ALLOWED_ORIGINS CHAT_HOURLY_LIMIT CHAT_GLOBAL_DAILY_LIMIT VAPID_PRIVATE_KEY VAPID_SUBJECT REMINDER_CRON_SECRET VAPID_PUBLIC_KEY; do
            value="${!name:-}"
            value="${value//[[:space:]]/}"   # 붙여 넣을 때 딸려 온 공백·줄바꿈 제거(모든 값이 공백을 담지 않는다)
            if [ -z "${value}" ]; then
              echo "::notice title=건너뜀::${name} 값이 비어 있어 넣지 않습니다(서버에 이미 있으면 그대로 둡니다)."
              continue
            fi
            # 공개 키는 비밀 키와 짝일 때만 의미가 있다 — 비밀 키를 서버에 직접 넣고(GitHub Secrets에는 없음) 공개 키만 여기서 덮으면
            # 예전 Variable 값으로 짝이 어긋나 발송이 멈춘다(2026-09-30 실제로 겪음). 비밀 키도 함께 넣을 때만 공개 키를 넣는다.
            if [ "${name}" = "VAPID_PUBLIC_KEY" ] && [ -z "${VAPID_PRIVATE_KEY//[[:space:]]/}" ]; then
              echo "::notice title=건너뜀::VAPID_PUBLIC_KEY — VAPID_PRIVATE_KEY Secret이 없어 서버의 짝을 그대로 둡니다."
              continue
            fi
            case "${value}" in
              *[\"\'\#\$\\\`]*)
                echo "::error title=${name} 형식::따옴표·#·\$·\\·\` 가 들어 있습니다. 값을 다시 복사해 넣으세요."
                exit 1 ;;
            esac
            printf '%s=%s\n' "${name}" "${value}" >> "${envfile}"
            names+=("${name}")
          done
          if [ "${#names[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "${envfile}" > /dev/null
            echo "넣은 비밀값(이름만): ${names[*]}"
          fi

          # 서버에 있는 비밀값 이름만 확인한다(값은 받지도 찍지도 않는다 — 목록은 이름과 해시뿐).
          if ! present="$(supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null)"; then
            echo "::notice title=확인 건너뜀::서버의 비밀값 목록을 읽지 못했습니다. Supabase 대시보드 → Edge Functions → Secrets에서 확인하세요."
            exit 0
          fi
          for name in ANTHROPIC_API_KEY VIDEO_API_URL ALLOWED_ORIGINS; do
            if ! grep -qw -- "${name}" <<< "${present}"; then
              case "${name}" in
                ANTHROPIC_API_KEY) echo "::warning title=AI 상담 꺼짐::ANTHROPIC_API_KEY가 서버에 없습니다. AI 상담은 동작하지 않습니다 — Variables의 NEXT_PUBLIC_AI_CHAT_ENABLED는 false로 두세요." ;;
                VIDEO_API_URL) echo "::notice title=영상 서버 기본값::VIDEO_API_URL이 서버에 없어 함수 기본값(https://hackathon-video-api.onrender.com)을 씁니다." ;;
                ALLOWED_ORIGINS) echo "::notice title=CORS 기본값::ALLOWED_ORIGINS가 서버에 없어 함수 기본값(https://5seoyoung.github.io, http://localhost:3000)을 씁니다. 도메인을 바꾸면 Variables에 넣으세요." ;;
              esac
            fi
          done
          # 매일 리마인더(선택) — 셋 중 하나라도 없으면 send-reminders는 발송하지 않는다(503 missing_env). 켜지 않을 거면 그대로 둔다.
          missing_reminder=()
          for name in VAPID_PRIVATE_KEY VAPID_SUBJECT REMINDER_CRON_SECRET; do
            grep -qw -- "${name}" <<< "${present}" || missing_reminder+=("${name}")
          done
          if [ "${#missing_reminder[@]}" -gt 0 ]; then
            echo "::notice title=매일 리마인더 꺼짐::서버에 없는 비밀값: ${missing_reminder[*]} — 켜려면 docs/PWA_AND_REMINDERS.md §5(키 만들기 → Secrets → Vault)."
          fi

      - name: Edge Function 배포 (videos · chat · send-reminders)
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        # 함수별 JWT 검사 여부는 supabase/config.toml의 [functions.*] verify_jwt를 따른다.
        # --use-api: Docker 없이 Supabase 서버에서 묶는다(러너에서 이미지를 받지 않는다).
        # send-reminders는 비밀값·Vault reminder_cron_secret이 생기기 전에는 부르는 곳이 없다(0004의 예약이 요청을 만들지 않음).
        run: supabase functions deploy videos chat send-reminders --project-ref "$PROJECT_REF" --use-api

      # AI 상담 함수가 로그인 확인에 쓰는 서버 키(service_role 권한)를 갖고 있는지 본다.
      # 틀린 토큰으로 한 번 부른다 → 401이면 정상(토큰 확인에서 끝나므로 Anthropic을 부르지 않고 한도도 쓰지 않는다).
      # 503 auth_unavailable이면 키가 없다 — 2025-11 이후 만든·Restore한 프로젝트에는 예전 방식 SUPABASE_SERVICE_ROLE_KEY가 없다.
      # AI 상담은 LAUNCH_CHECKLIST 5단계 전까지 꺼져 있으므로 실패로 멈추지 않고 경고만 남긴다(5-6에서 이 경고가 없어야 한다).
      - name: 배포 확인 (AI 상담 함수의 로그인 확인)
        id: smoke
        if: steps.check.outputs.run == 'true'
        env:
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        run: |
          set -uo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/chat"
          out="${RUNNER_TEMP}/chat-check.json"
          body='{"preset":"patient_edu","messages":[{"role":"user","content":"deploy check"}]}'
          status="000"
          for attempt in 1 2 3; do
            status="$(curl -sS -o "${out}" -w '%{http_code}' --max-time 60 -X POST "${url}" \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer onmom-deploy-check' \
              --data "${body}" 2>/dev/null)" || status="000"
            # 방금 배포한 함수가 아직 준비 중이면(연결 실패·404·502·504·500) 잠시 뒤 다시, 그 밖의 응답은 바로 판단
            case "${status}" in
              000|404|500|502|504) sleep 10 ;;
              *) break ;;
            esac
          done
          # 응답 본문은 { ok, code }뿐이다 — code만 뽑는다
          code="$(grep -o '"code":"[a-z_]*"' "${out}" 2>/dev/null | head -n1 | cut -d'"' -f4 || true)"
          # 401이라도 code가 unauthorized가 아니면 함수가 아니라 게이트웨이가 막은 것(verify_jwt가 켜짐) — 정상으로 보지 않는다
          if [ "${status}" = "401" ] && [ "${code}" = "unauthorized" ]; then
            echo "chat=ok" >> "$GITHUB_OUTPUT"
            echo "AI 상담 함수: 로그인 확인 동작(401 unauthorized)"
          elif [ "${status}" = "503" ] && [ "${code}" = "auth_unavailable" ]; then
            echo "chat=no_key" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI 상담 — 로그인 확인 불가::chat 함수가 로그인을 확인할 서버 키를 찾지 못했습니다(503 auth_unavailable). 이대로 AI 상담을 켜면 모든 질문이 실패합니다. 개발자에게 알리세요 — 함수가 읽는 SUPABASE_SECRET_KEYS(새 secret 키 default) 또는 예전 SUPABASE_SERVICE_ROLE_KEY가 없습니다. Edge Functions → chat → Logs의 missing_env도 확인 (docs/SUPABASE_SETUP.md B-4)."
          else
            echo "chat=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI 상담 — 확인 못 함::chat 함수 응답이 예상과 다릅니다(HTTP ${status} ${code:-}). Supabase → Edge Functions → chat → Logs를 확인하세요."
          fi
          exit 0

      - name: 결과 요약
        if: always() && steps.check.outputs.run == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
          CHAT_CHECK: ${{ steps.smoke.outputs.chat }}
        run: |
          {
            echo "## Supabase 배포"
            echo ""
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "- 테스트 · DB 표(supabase/migrations) · Edge Function 비밀값 · 함수(videos, chat, send-reminders) 배포를 마쳤습니다."
              echo "- 매일 리마인더는 Supabase SQL Editor에서 Vault \`reminder_cron_secret\`을 넣어야 켜집니다(docs/PWA_AND_REMINDERS.md §5 E). 넣기 전에는 예약이 함수를 부르지 않습니다."
              case "${CHAT_CHECK}" in
                ok) echo "- AI 상담 함수의 로그인 확인: 정상" ;;
                no_key) echo "- ⚠️ AI 상담 함수가 로그인을 확인할 서버 키를 찾지 못했습니다 — AI 상담을 켜기 전에 개발자에게(설정 안내 B-4)." ;;
                *) echo "- ⚠️ AI 상담 함수의 로그인 확인을 하지 못했습니다 — Edge Functions → chat → Logs 확인." ;;
              esac
              echo "- 웹 사이트는 이 워크플로가 바꾸지 않습니다. 사이트 설정(NEXT_PUBLIC_*)을 바꿨다면 Actions → Deploy to GitHub Pages → Run workflow."
            else
              echo "- 중간에 실패했습니다. 빨간 ✗ 단계의 메시지와 docs/SUPABASE_SETUP.md \"I. 문제 해결\"을 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
