# Supabase 배포 — DB 표(마이그레이션) → Edge Function 비밀값 → Edge Function(videos·chat·send-reminders) 배포.
# 설명서: docs/dev/SUPABASE_SETUP.md (D단계). 웹 사이트 배포는 deploy.yml이 따로 한다.
#
# 필요한 값 — 저장소 Settings → Secrets and variables → Actions
#   Secrets:   SUPABASE_ACCESS_TOKEN(필수) · SUPABASE_DB_PASSWORD(필수) · ANTHROPIC_API_KEY(AI 상담에 필요 — 없으면 질문마다 앱 안내로만 답한다)
#              VAPID_PRIVATE_KEY · VAPID_SUBJECT · REMINDER_CRON_SECRET(매일 리마인더를 켤 때 — docs/dev/PWA_AND_REMINDERS.md §5)
#   Variables: SUPABASE_PROJECT_REF(필수) · VIDEO_API_URL · ALLOWED_ORIGINS
#              CHAT_HOURLY_LIMIT · CHAT_GUEST_HOURLY_LIMIT · CHAT_GLOBAL_HOURLY_LIMIT · CHAT_GLOBAL_DAILY_LIMIT(AI 상담 한도 — 공개값)
#              ANTHROPIC_WORKSPACE_ID(조직 전체용 Anthropic 키일 때 — wrkspc_…, Secrets에 넣어도 읽는다)
#              NEXT_PUBLIC_VAPID_PUBLIC_KEY(사이트 빌드와 같은 값 — 함수 비밀값 VAPID_PUBLIC_KEY로 넣어 비밀 키와 짝이 맞는지 함수가 확인)
#              AI_CHAT_SERVER_ENABLED(서버 쪽 AI 상담 스위치 — "true"·"false"·비움만. 비우면 아래 기본값. 함수 비밀값 AI_CHAT_SERVER_ENABLED로 넣는다)
# 서버 쪽 AI 스위치: chat 함수는 AI_CHAT_SERVER_ENABLED가 정확히 "true"일 때만 Anthropic을 부른다. 아니면 ANTHROPIC_API_KEY가 있어도 모든 요청에 503 ai_disabled로
# 답하고, 웹은 그 답을 "AI 미설정"과 같게 다룬다(앱 규칙 안내). 2026-11-06 대표 결정으로 켠다 — 값을 고르는 순서: Variable → 아래 env의 기본값 "true".
# 끄려면 Variable AI_CHAT_SERVER_ENABLED=false를 넣고 이 워크플로를 돌린다. 급하면 Supabase Edge Functions → Secrets에서 값을 지우면 바로 꺼지지만,
# Variable 없이는 다음 실행이 기본값으로 되살리므로 Variable도 함께 넣는다. 스위치는 새 함수가 올라간 뒤에 넣는다(아래 "서버 쪽 AI 스위치 넣기").
# 매일 리마인더는 이 워크플로만으로 켜지지 않는다 — 마지막에 Supabase SQL Editor에서 Vault reminder_cron_secret과 project_url을 넣어야
# 예약이 함수를 부른다(docs/dev/PWA_AND_REMINDERS.md §5 E). 둘 중 하나라도 없으면 예약(0007, 매시)이 돌아도 요청을 만들지 않는다.
# 비어 있는 선택 값은 건너뛴다(서버에 이미 있던 값은 그대로 남고, 없으면 함수 기본값 — supabase/functions/_shared).
#
# 하지 않는 것: 인증(Auth) 설정 올리기(`supabase config push`) — 인증 설정은 대시보드가 기준이다(supabase/config.toml 참고).
#              비밀값 지우기 — 비운 값은 건너뛸 뿐이다. 서버에서 지우려면 Supabase 대시보드 → Edge Functions → Secrets(설명서 G). 단 AI 스위치는 위 설명대로 되살아난다.
# 비밀값은 로그에 찍지 않는다: set -x 금지, 명령 인자로 넘기지 않고(파일로), 값 대신 이름만 출력한다.
# 운영 DB·함수를 바꾸므로 main에서만 돈다(Run workflow에서 다른 브랜치를 골라도 건너뜀). 테스트(npm test)가 통과해야 배포한다.
# 함수 타입 검사(deno check — 아래 deno-check 작업)는 PR에서도 돈다. 타입 오류가 있으면 실패하고, main에서는 배포 작업이 시작되지 않는다.
name: Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      # 이 워크플로를 고친 커밋도 한 번 돌아 바뀐 배포 방식이 바로 확인된다
      - ".github/workflows/supabase.yml"
  # PR에서는 함수 타입 검사(deno-check)만 돈다 — deploy 작업은 main에서만(아래 if). 비밀값을 쓰지 않는다.
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

# Edge Function의 CORS 허용 주소(공개값) — Variable ALLOWED_ORIGINS가 비어 있으면 이 값을 함수 비밀값 ALLOWED_ORIGINS로 넣는다.
# 웹 사이트 주소를 옮기면(커스텀 도메인) 이 줄을 고쳐 supabase/ 변경과 함께 커밋하거나, 커밋 뒤 Actions → Supabase → Run workflow.
# 2026-11-04 전용 도메인 onmomcare.app으로 옮겼다. 옛 Pages 주소(https://5seoyoung.github.io)는 다른 사이트와 같은 출처라 허용하지 않는다(옛 주소는 새 주소로 넘어간다).
env:
  ONMOM_ALLOWED_ORIGINS: https://onmomcare.app,http://localhost:3000
  # 서버 쪽 AI 스위치의 기본값(공개값) — Variable AI_CHAT_SERVER_ENABLED가 비어 있으면 이 값을 함수 비밀값으로 넣는다(2026-11-06 대표 결정: 켠다).
  # "false"로 바꿔 커밋해도 끈다. 화면 쪽 스위치는 따로다(deploy.yml ONMOM_AI).
  ONMOM_AI_CHAT_SERVER_ENABLED: "true"

# main 배포는 한 번에 하나씩(취소 없이). PR 실행은 PR마다 따로 묶는다 — 같은 묶음에 들어가 기다리던 main 배포를 밀어내지 않게.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('supabase-pr-{0}', github.ref) || 'supabase-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 함수 세 개의 Deno 타입 검사 — Next tsc는 index.ts의 Deno 전용 가져오기(npm:·".ts")를 읽지 못해 이 검사만이 그 파일들을 본다
  # (docs/dev/SUPABASE_FUNCTIONS.md §7). index.ts에서 handler·adapters·_shared까지 따라가 모두 검사한다. 저장소에 파일을 만들지 않는다
  # (--no-lock, --node-modules-dir=none — npm: 패키지는 러너의 Deno 캐시에만 받는다).
  # Deno 버전과 액션 커밋을 고정한다 — 올릴 때는 setup-deno 새 태그의 커밋을 확인해(git ls-remote --tags https://github.com/denoland/setup-deno.git)
  # 두 줄을 함께 바꾸고, 내 컴퓨터에서 같은 Deno 버전으로 한 번 돌려 본다.
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Deno 내려받기가 잠깐 실패하는 일이 있다(2026-11-08 HTTP 504로 배포가 막힘) — 30초 뒤 한 번 더 받는다.
      # 두 번째도 실패하면 이 작업이 실패하고 배포는 시작하지 않는다(검사를 건너뛰고 배포하지 않는다).
      - id: deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        continue-on-error: true
        with:
          deno-version: 2.9.8

      - if: steps.deno.outcome == 'failure'
        run: sleep 30

      - if: steps.deno.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: Deno 타입 검사 (videos · chat · send-reminders · account)
        run: deno check --no-lock --node-modules-dir=none supabase/functions/videos/index.ts supabase/functions/chat/index.ts supabase/functions/send-reminders/index.ts supabase/functions/account/index.ts

  deploy:
    # 함수 타입 검사가 통과해야 시작한다(실패하면 DB·비밀값·함수 모두 그대로).
    needs: deno-check
    # 운영 프로젝트에 db push·함수 배포를 하므로 main에서만 — Run workflow에서 다른 브랜치를 고르거나 PR이면 이 작업은 건너뛴다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 뒤 단계(Supabase CLI)가 GITHUB_TOKEN을 .git/config에서 읽을 수 없게 한다 — 이 작업은 저장소에 쓰지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 설정 확인
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || env.ONMOM_ALLOWED_ORIGINS }}
          CHAT_HOURLY_LIMIT: ${{ vars.CHAT_HOURLY_LIMIT }}
          CHAT_GUEST_HOURLY_LIMIT: ${{ vars.CHAT_GUEST_HOURLY_LIMIT }}
          CHAT_GLOBAL_HOURLY_LIMIT: ${{ vars.CHAT_GLOBAL_HOURLY_LIMIT }}
          CHAT_GLOBAL_DAILY_LIMIT: ${{ vars.CHAT_GLOBAL_DAILY_LIMIT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
          AI_CHAT_SERVER_ENABLED: ${{ vars.AI_CHAT_SERVER_ENABLED || env.ONMOM_AI_CHAT_SERVER_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing+=("Secrets → SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD}" ] || missing+=("Secrets → SUPABASE_DB_PASSWORD")
          [ -n "${SUPABASE_PROJECT_REF}" ] || missing+=("Variables → SUPABASE_PROJECT_REF")

          # 아직 아무것도 넣지 않았는데 main push로 돌았으면 조용히 건너뛴다(사이트는 지금처럼 브라우저 저장만).
          # 직접 실행(Run workflow)했거나 일부만 넣었으면 무엇이 빠졌는지 알리고 실패한다.
          if [ "${#missing[@]}" -eq 3 ] && [ "${EVENT_NAME}" = "push" ]; then
            echo "::notice title=Supabase 배포 건너뜀::아직 Supabase 값이 없습니다. docs/dev/SUPABASE_SETUP.md C단계를 마친 뒤 Actions → Supabase → Run workflow로 실행하세요."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error title=값이 없습니다::저장소 Settings → Secrets and variables → Actions → ${m} 를 넣어 주세요 (docs/dev/SUPABASE_SETUP.md C단계)."
            done
            exit 1
          fi

          ref="${SUPABASE_PROJECT_REF//[[:space:]]/}"
          if ! [[ "${ref}" =~ ^[a-z]{20}$ ]]; then
            echo "::error title=SUPABASE_PROJECT_REF 형식::영문 소문자 20자여야 합니다(주소 https://<이 값>.supabase.co 의 가운데 부분). 주소 전체나 공백을 넣지 않았는지 확인하세요."
            exit 1
          fi

          # 웹이 부르는 Edge Function의 CORS 허용 주소(공개값). 비우면 함수의 기본값(배포 사이트·localhost:3000)을 쓴다.
          # 함수는 항목마다 "https://호스트"만 떼어 쓰고 알아볼 수 없는 항목은 버린다 — 모두 버려지면 웹 요청이 전부 막히므로 여기서 미리 거른다.
          if [ -n "${ALLOWED_ORIGINS//[[:space:]]/}" ]; then
            IFS=',' read -r -a origins <<< "${ALLOWED_ORIGINS}"
            for o in "${origins[@]}"; do
              o="${o//[[:space:]]/}"
              [ -z "${o}" ] && continue
              if ! [[ "${o}" =~ ^https?://[^/?#]+(/.*)?$ ]]; then
                echo "::error title=ALLOWED_ORIGINS 형식::'${o}' — https://onmomcare.app 처럼 http(s)://로 시작해야 하고, 여러 개는 쉼표로 나눕니다."
                exit 1
              fi
            done
          fi

          # AI 상담 요청 한도(선택) — 한 사람의 1시간 요청 수(1~1000), 익명 게스트의 1시간 요청 수(1~1000, 한 사람 한도까지),
          # 전체 1시간 요청 수, 전체 하루 요청 수. 비우면 함수 기본값(supabase/functions/_shared/chat.ts chatLimitsFromEnv — 10·5·60·500).
          for name in CHAT_HOURLY_LIMIT CHAT_GUEST_HOURLY_LIMIT CHAT_GLOBAL_HOURLY_LIMIT CHAT_GLOBAL_DAILY_LIMIT; do
            v="${!name:-}"
            v="${v//[[:space:]]/}"
            if [ -n "${v}" ] && ! [[ "${v}" =~ ^[1-9][0-9]{0,6}$ ]]; then
              echo "::error title=${name} 형식::1 이상의 정수만 넣습니다(쉼표·단위 없이, 예: 30)."
              exit 1
            fi
          done
          # 게스트 한도가 한 사람 한도보다 크면 함수는 한 사람 한도까지만 쓴다(게스트에게 더 주지 않는다) — 실수일 수 있어 알린다.
          guest_limit="${CHAT_GUEST_HOURLY_LIMIT//[[:space:]]/}"
          user_limit="${CHAT_HOURLY_LIMIT//[[:space:]]/}"
          if [ -n "${guest_limit}" ] && [ -n "${user_limit}" ] && [ "${guest_limit}" -gt "${user_limit}" ]; then
            echo "::warning title=CHAT_GUEST_HOURLY_LIMIT::게스트 한도(${guest_limit})가 한 사람 한도(${user_limit})보다 큽니다. 함수는 ${user_limit}까지만 씁니다."
          fi

          # Anthropic 워크스페이스(선택) — 조직 전체용 키는 요청마다 워크스페이스를 지정해야 한다(chat/index.ts anthropic-workspace-id).
          wsid="${ANTHROPIC_WORKSPACE_ID//[[:space:]]/}"
          if [ -n "${wsid}" ] && ! [[ "${wsid}" =~ ^wrkspc_[A-Za-z0-9]+$ ]]; then
            echo "::error title=ANTHROPIC_WORKSPACE_ID 형식::Anthropic 콘솔 Settings → Workspaces의 ID(wrkspc_로 시작)를 그대로 넣습니다."
            exit 1
          fi

          # 서버 쪽 AI 스위치 — "true"면 chat 함수가 Anthropic을 부르고, "false"면 끈다. Variable을 비우면 위 env의 기본값을 쓴다.
          # 그 밖의 값(TRUE·1·yes …)은 함수가 꺼짐으로 읽으므로, 켰다고 착각하지 않게 여기서 멈춘다.
          aion="${AI_CHAT_SERVER_ENABLED//[[:space:]]/}"
          if [ -n "${aion}" ] && [ "${aion}" != "true" ] && [ "${aion}" != "false" ]; then
            echo "::error title=AI_CHAT_SERVER_ENABLED 형식::true 또는 false(소문자)만 넣습니다. 비우면 저장소의 기본값(env ONMOM_AI_CHAT_SERVER_ENABLED)을 씁니다."
            exit 1
          fi

          # 매일 리마인더(선택) — 형식만 본다(값은 찍지 않는다). 비어 있으면 건너뛴다(리마인더는 꺼진 채).
          # 비밀 키: scripts/generate-vapid.mjs의 비밀 키(base64url 43자). 공개 키(87자)를 잘못 넣는 실수를 막는다.
          vpriv="${VAPID_PRIVATE_KEY//[[:space:]]/}"
          if [ -n "${vpriv}" ] && ! [[ "${vpriv}" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error title=VAPID_PRIVATE_KEY 형식::scripts/generate-vapid.mjs가 출력한 비밀 키(43자)를 그대로 넣습니다. 공개 키(87자)를 넣지 않았는지 확인하세요."
            exit 1
          fi
          vpub="${VAPID_PUBLIC_KEY//[[:space:]]/}"
          if [ -n "${vpub}" ] && ! [[ "${vpub}" =~ ^B[A-Za-z0-9_-]{86}$ ]]; then
            echo "::error title=NEXT_PUBLIC_VAPID_PUBLIC_KEY 형식::공개 키는 87자, B로 시작합니다(scripts/generate-vapid.mjs)."
            exit 1
          fi
          vsub="${VAPID_SUBJECT//[[:space:]]/}"
          if [ -n "${vsub}" ] && ! [[ "${vsub}" =~ ^(mailto:[^@]+@[^@]+|https://[^/]+.*)$ ]]; then
            echo "::error title=VAPID_SUBJECT 형식::mailto:<운영 이메일> 또는 https://… 주소여야 합니다."
            exit 1
          fi
          rsec="${REMINDER_CRON_SECRET//[[:space:]]/}"
          if [ -n "${rsec}" ] && [ "${#rsec}" -lt 16 ]; then
            echo "::error title=REMINDER_CRON_SECRET 길이::16자 이상이어야 합니다(예: openssl rand -hex 32)."
            exit 1
          fi

          for fn in videos chat send-reminders account; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "::error title=함수 파일 없음::supabase/functions/${fn}/index.ts 가 저장소에 없습니다."
              exit 1
            fi
          done

          echo "project_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # 테스트 관문 — 규칙·Edge Function 처리 테스트(src/api/edgeFunctions·edgeHandlers 포함)가 통과해야 DB·함수를 바꾼다.
      # 실패하면 뒤 단계는 모두 건너뛴다(각 단계의 if에는 success()가 암묵적으로 붙는다).
      - uses: actions/setup-node@v7
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: 테스트
        if: steps.check.outputs.run == 'true'
        run: |
          npm ci
          npm test

      # 제3자 액션은 커밋으로 고정한다(태그는 옮길 수 있다) — 이 액션이 설치한 CLI가 계정 전체 토큰(SUPABASE_ACCESS_TOKEN)을 받는다.
      # 올릴 때: git ls-remote --tags https://github.com/supabase/setup-cli.git 로 새 태그의 커밋을 확인해 두 줄을 함께 바꾼다.
      # CLI 버전도 고정한다 — 새 버전은 이 줄을 바꿔 한 번 돌려 보고 올린다.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.check.outputs.run == 'true'
        with:
          version: 2.117.0

      - name: 프로젝트 연결
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: DB 표 만들기·고치기 (supabase/migrations)
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # 서버에 아직 적용하지 않은 파일만 번호 순서로 적용한다(이미 적용한 번호는 건너뜀).
        run: |
          set -euo pipefail
          ls -1 supabase/migrations
          supabase db push --linked --yes

      - name: Edge Function 비밀값 넣기
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_API_URL: ${{ vars.VIDEO_API_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || env.ONMOM_ALLOWED_ORIGINS }}
          CHAT_HOURLY_LIMIT: ${{ vars.CHAT_HOURLY_LIMIT }}
          CHAT_GUEST_HOURLY_LIMIT: ${{ vars.CHAT_GUEST_HOURLY_LIMIT }}
          CHAT_GLOBAL_HOURLY_LIMIT: ${{ vars.CHAT_GLOBAL_HOURLY_LIMIT }}
          CHAT_GLOBAL_DAILY_LIMIT: ${{ vars.CHAT_GLOBAL_DAILY_LIMIT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
          # 카카오 연결 끊기·연결 해제 웹훅(선택 — 대표 결정 Q5 뒤). 비어 있으면 넣지 않아 account 함수는 꺼진 채로 둔다.
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          KAKAO_APP_ID: ${{ vars.KAKAO_APP_ID }}
        run: |
          set -euo pipefail
          # 값은 명령 인자(다른 프로세스가 볼 수 있음)가 아니라 이 단계에서만 읽을 수 있는 임시 파일로 넘기고 바로 지운다.
          umask 077
          envfile="$(mktemp)"
          trap 'rm -f "${envfile}"' EXIT
          names=()
          for name in ANTHROPIC_API_KEY ANTHROPIC_WORKSPACE_ID VIDEO_API_URL ALLOWED_ORIGINS CHAT_HOURLY_LIMIT CHAT_GUEST_HOURLY_LIMIT CHAT_GLOBAL_HOURLY_LIMIT CHAT_GLOBAL_DAILY_LIMIT VAPID_PRIVATE_KEY VAPID_SUBJECT REMINDER_CRON_SECRET VAPID_PUBLIC_KEY KAKAO_ADMIN_KEY KAKAO_APP_ID; do
            value="${!name:-}"
            value="${value//[[:space:]]/}"   # 붙여 넣을 때 딸려 온 공백·줄바꿈 제거(모든 값이 공백을 담지 않는다)
            if [ -z "${value}" ]; then
              echo "::notice title=건너뜀::${name} 값이 비어 있어 넣지 않습니다(서버에 이미 있으면 그대로 둡니다)."
              continue
            fi
            # 공개 키는 비밀 키와 짝일 때만 의미가 있다 — 비밀 키를 서버에 직접 넣고(GitHub Secrets에는 없음) 공개 키만 여기서 덮으면
            # 예전 Variable 값으로 짝이 어긋나 발송이 멈춘다(2026-09-30 실제로 겪음). 비밀 키도 함께 넣을 때만 공개 키를 넣는다.
            if [ "${name}" = "VAPID_PUBLIC_KEY" ] && [ -z "${VAPID_PRIVATE_KEY//[[:space:]]/}" ]; then
              echo "::notice title=건너뜀::VAPID_PUBLIC_KEY — VAPID_PRIVATE_KEY Secret이 없어 서버의 짝을 그대로 둡니다."
              continue
            fi
            case "${value}" in
              *[\"\'\#\$\\\`]*)
                echo "::error title=${name} 형식::따옴표·#·\$·\\·\` 가 들어 있습니다. 값을 다시 복사해 넣으세요."
                exit 1 ;;
            esac
            printf '%s=%s\n' "${name}" "${value}" >> "${envfile}"
            names+=("${name}")
          done
          if [ "${#names[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "${envfile}" > /dev/null
            echo "넣은 비밀값(이름만): ${names[*]}"
          fi

          # 서버에 있는 비밀값 이름만 확인한다(값은 받지도 찍지도 않는다 — 목록은 이름과 해시뿐).
          if ! present="$(supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null)"; then
            echo "::notice title=확인 건너뜀::서버의 비밀값 목록을 읽지 못했습니다. Supabase 대시보드 → Edge Functions → Secrets에서 확인하세요."
            exit 0
          fi
          for name in ANTHROPIC_API_KEY VIDEO_API_URL ALLOWED_ORIGINS; do
            if ! grep -qw -- "${name}" <<< "${present}"; then
              case "${name}" in
                ANTHROPIC_API_KEY) echo "::warning title=AI 상담 — 키 없음::ANTHROPIC_API_KEY가 서버에 없습니다. 모든 질문이 앱 안내로만 답합니다(503 not_configured). GitHub Secret ANTHROPIC_API_KEY를 넣고 이 워크플로를 다시 실행하세요." ;;
                VIDEO_API_URL) echo "::notice title=영상 서버 기본값::VIDEO_API_URL이 서버에 없어 함수 기본값(https://hackathon-video-api.onrender.com)을 씁니다." ;;
                ALLOWED_ORIGINS) echo "::notice title=CORS 기본값::ALLOWED_ORIGINS가 서버에 없어 함수 기본값(supabase/functions/_shared/cors.ts DEFAULT_ALLOWED_ORIGINS)을 씁니다. 도메인을 바꾸면 위 env ONMOM_ALLOWED_ORIGINS를 고치세요." ;;
              esac
            fi
          done
          # 매일 리마인더(선택) — 셋 중 하나라도 없으면 send-reminders는 발송하지 않는다(503 missing_env). 켜지 않을 거면 그대로 둔다.
          missing_reminder=()
          for name in VAPID_PRIVATE_KEY VAPID_SUBJECT REMINDER_CRON_SECRET; do
            grep -qw -- "${name}" <<< "${present}" || missing_reminder+=("${name}")
          done
          if [ "${#missing_reminder[@]}" -gt 0 ]; then
            echo "::notice title=매일 리마인더 꺼짐::서버에 없는 비밀값: ${missing_reminder[*]} — 켜려면 docs/dev/PWA_AND_REMINDERS.md §5(키 만들기 → Secrets → Vault)."
          fi

      - name: Edge Function 배포 (videos · chat · send-reminders · account)
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        # 함수별 JWT 검사 여부는 supabase/config.toml의 [functions.*] verify_jwt를 따른다.
        # --use-api: Docker 없이 Supabase 서버에서 묶는다(러너에서 이미지를 받지 않는다).
        # send-reminders는 비밀값·Vault reminder_cron_secret·project_url이 생기기 전에는 부르는 곳이 없다(0007의 예약이 요청을 만들지 않음).
        # account는 비밀값 KAKAO_ADMIN_KEY가 없으면 꺼진 채로 돈다(끊기 요청 skipped, 카카오 웹훅 401 — functions/account/handler.ts).
        run: supabase functions deploy videos chat send-reminders account --project-ref "$PROJECT_REF" --use-api

      # 서버 쪽 AI 스위치는 함수를 배포한 뒤에 넣는다 — 비밀값은 다음 요청부터 바로 적용되므로, 먼저 넣으면 스위치를 처음 켜는 배포에서 옛 함수 코드(약물 preset·
      # 게스트 허용)가 AI가 켜진 채 잠시 돌 수 있다. 배포가 실패하면 이 단계도 건너뛰어 서버 값은 그대로다. 공개값이라 값을 그대로 찍는다.
      - name: 서버 쪽 AI 스위치 넣기
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
          AI_CHAT_SERVER_ENABLED: ${{ vars.AI_CHAT_SERVER_ENABLED || env.ONMOM_AI_CHAT_SERVER_ENABLED }}
        run: |
          set -euo pipefail
          value="${AI_CHAT_SERVER_ENABLED//[[:space:]]/}"
          if [ -z "${value}" ]; then
            echo "::notice title=건너뜀::AI_CHAT_SERVER_ENABLED 값이 비어 있어 넣지 않습니다(서버에 있던 값 그대로)."
            exit 0
          fi
          supabase secrets set --project-ref "$PROJECT_REF" "AI_CHAT_SERVER_ENABLED=${value}" > /dev/null
          echo "서버 쪽 AI 스위치: ${value}"

      # AI 상담 함수가 로그인 확인에 쓰는 서버 키(service_role 권한)를 갖고 있는지 본다.
      # 틀린 토큰으로 한 번 부른다 → 401이면 정상(토큰 확인에서 끝나므로 Anthropic을 부르지 않고 한도도 쓰지 않는다).
      # 503 ai_disabled면 서버 쪽 AI 스위치가 꺼져 있다 — 함수가 로그인 확인 전에 끝내므로 서버 키는 볼 수 없다. 스위치를 켠 값으로 돌렸다면 경고, 일부러 껐다면 알림만.
      # 503 auth_unavailable이면 키가 없다 — 2025-11 이후 만든·Restore한 프로젝트에는 예전 방식 SUPABASE_SERVICE_ROLE_KEY가 없다.
      # 이 확인은 Anthropic을 부르지 않으므로 ANTHROPIC_API_KEY가 유효한지는 알 수 없다(배포 뒤 질문 하나로 본다). 실패로 멈추지 않고 경고만 남긴다.
      - name: 배포 확인 (AI 상담 함수의 로그인 확인)
        id: smoke
        if: steps.check.outputs.run == 'true'
        env:
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
          AI_CHAT_SERVER_ENABLED: ${{ vars.AI_CHAT_SERVER_ENABLED || env.ONMOM_AI_CHAT_SERVER_ENABLED }}
        run: |
          set -uo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/chat"
          out="${RUNNER_TEMP}/chat-check.json"
          body='{"preset":"patient_edu","messages":[{"role":"user","content":"deploy check"}]}'
          status="000"
          for attempt in 1 2 3; do
            status="$(curl -sS -o "${out}" -w '%{http_code}' --max-time 60 -X POST "${url}" \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer onmom-deploy-check' \
              --data "${body}" 2>/dev/null)" || status="000"
            # 방금 배포한 함수가 아직 준비 중이면(연결 실패·404·502·504·500) 잠시 뒤 다시, 그 밖의 응답은 바로 판단
            case "${status}" in
              000|404|500|502|504) sleep 10 ;;
              *) break ;;
            esac
          done
          # 응답 본문은 { ok, code }뿐이다 — code만 뽑는다
          code="$(grep -o '"code":"[a-z_]*"' "${out}" 2>/dev/null | head -n1 | cut -d'"' -f4 || true)"
          # 401이라도 code가 unauthorized가 아니면 함수가 아니라 게이트웨이가 막은 것(verify_jwt가 켜짐) — 정상으로 보지 않는다
          if [ "${status}" = "401" ] && [ "${code}" = "unauthorized" ]; then
            echo "chat=ok" >> "$GITHUB_OUTPUT"
            echo "AI 상담 함수: 로그인 확인 동작(401 unauthorized)"
          elif [ "${status}" = "503" ] && [ "${code}" = "ai_disabled" ]; then
            echo "chat=ai_off" >> "$GITHUB_OUTPUT"
            if [ "${AI_CHAT_SERVER_ENABLED//[[:space:]]/}" = "false" ]; then
              echo "::notice title=AI 상담 — 서버 쪽 스위치 꺼짐::Variable AI_CHAT_SERVER_ENABLED=false라 chat 함수가 503 ai_disabled로 답합니다(일부러 끈 상태). 다시 켜려면 Variable을 지우고 이 워크플로를 돌립니다."
            else
              echo "::warning title=AI 상담 — 서버 쪽 스위치가 켜지지 않음::스위치를 켠 값으로 돌렸는데 chat 함수가 503 ai_disabled로 답했습니다. Edge Functions → Secrets의 AI_CHAT_SERVER_ENABLED와 함수 Logs의 시작 줄 ai를 확인하세요."
            fi
          elif [ "${status}" = "503" ] && [ "${code}" = "auth_unavailable" ]; then
            echo "chat=no_key" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI 상담 — 로그인 확인 불가::chat 함수가 로그인을 확인할 서버 키를 찾지 못했습니다(503 auth_unavailable). 이대로면 모든 질문이 앱 안내로만 답합니다. 개발자에게 알리세요 — 함수가 읽는 SUPABASE_SECRET_KEYS(새 secret 키 default) 또는 예전 SUPABASE_SERVICE_ROLE_KEY가 없습니다. Edge Functions → chat → Logs의 missing_env도 확인 (docs/dev/SUPABASE_SETUP.md B-4)."
          else
            echo "chat=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI 상담 — 확인 못 함::chat 함수 응답이 예상과 다릅니다(HTTP ${status} ${code:-}). Supabase → Edge Functions → chat → Logs를 확인하세요."
          fi
          exit 0

      # 계정 함수(카카오 연결 끊기·웹훅)가 배포됐고 토큰을 스스로 확인하는지 본다 — 틀린 토큰으로 끊기를 한 번 부른다(카카오를 부르지 않는다).
      # 401 unauthorized면 정상(키가 없어도 같다 — 키 확인은 로그인 확인 뒤). 실패로 멈추지 않고 경고만 남긴다.
      - name: 배포 확인 (계정 함수의 로그인 확인)
        id: account_smoke
        if: steps.check.outputs.run == 'true'
        env:
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
        run: |
          set -uo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/account"
          out="${RUNNER_TEMP}/account-check.json"
          status="000"
          for attempt in 1 2 3; do
            status="$(curl -sS -o "${out}" -w '%{http_code}' --max-time 30 -X POST "${url}" \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer onmom-deploy-check' \
              --data '{"action":"kakao-unlink-self"}' 2>/dev/null)" || status="000"
            case "${status}" in
              000|404|500|502|504) sleep 10 ;;
              *) break ;;
            esac
          done
          code="$(grep -o '"code":"[a-z_]*"' "${out}" 2>/dev/null | head -n1 | cut -d'"' -f4 || true)"
          if [ "${status}" = "401" ] && [ "${code}" = "unauthorized" ]; then
            echo "account=ok" >> "$GITHUB_OUTPUT"
            echo "계정 함수: 로그인 확인 동작(401 unauthorized)"
          else
            echo "account=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=계정 함수 — 확인 못 함::account 함수 응답이 예상과 다릅니다(HTTP ${status} ${code:-}). 계정 삭제는 그대로 되지만 카카오 연결 끊기는 건너뜁니다. Supabase → Edge Functions → account → Logs를 확인하세요."
          fi
          exit 0

      - name: 결과 요약
        if: always() && steps.check.outputs.run == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
          CHAT_CHECK: ${{ steps.smoke.outputs.chat }}
          ACCOUNT_CHECK: ${{ steps.account_smoke.outputs.account }}
          # AI 상담 한도 — 공개값(Variables)이라 요약에 값을 적는다. 비밀값은 여기 넘기지 않는다.
          CHAT_HOURLY_LIMIT: ${{ vars.CHAT_HOURLY_LIMIT }}
          CHAT_GUEST_HOURLY_LIMIT: ${{ vars.CHAT_GUEST_HOURLY_LIMIT }}
          CHAT_GLOBAL_HOURLY_LIMIT: ${{ vars.CHAT_GLOBAL_HOURLY_LIMIT }}
          CHAT_GLOBAL_DAILY_LIMIT: ${{ vars.CHAT_GLOBAL_DAILY_LIMIT }}
        run: |
          {
            echo "## Supabase 배포"
            echo ""
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "- 테스트 · DB 표(supabase/migrations) · Edge Function 비밀값 · 함수(videos, chat, send-reminders, account) 배포를 마쳤습니다."
              if [ "${ACCOUNT_CHECK}" = "ok" ]; then
                echo "- 계정 함수(account)의 로그인 확인: 정상. 카카오 연결 끊기·웹훅은 함수 비밀값 KAKAO_ADMIN_KEY가 있을 때만 켜집니다(없으면 끊기 건너뜀·웹훅 401)."
              else
                echo "- ⚠️ 계정 함수(account)를 확인하지 못했습니다 — Edge Functions → account → Logs. 계정 삭제 자체는 그대로 됩니다."
              fi
              echo "- 매일 리마인더는 Supabase SQL Editor에서 Vault \`reminder_cron_secret\`과 \`project_url\`(https://<ref>.supabase.co)을 넣어야 켜집니다(docs/dev/PWA_AND_REMINDERS.md §5 E). 둘 중 하나라도 없으면 예약이 함수를 부르지 않습니다."
              echo "- 서버 쪽 AI 상담 스위치(함수 비밀값 AI_CHAT_SERVER_ENABLED)는 \"true\"일 때만 켜집니다. Variable이 없으면 저장소의 기본값(env ONMOM_AI_CHAT_SERVER_ENABLED)을 함수 배포 뒤에 넣습니다. 끄려면 Variable을 false로 두고 이 워크플로를 다시 돌립니다 — 서버 값만 지우면 다음 실행이 되살립니다."
              case "${CHAT_CHECK}" in
                ok) echo "- AI 상담 함수의 로그인 확인: 정상(서버 쪽 AI 스위치 켜짐)" ;;
                ai_off) echo "- **서버 쪽 AI 상담: 꺼짐** — chat 함수가 503 ai_disabled로 답합니다(AI_CHAT_SERVER_ENABLED가 \"true\"가 아님). ANTHROPIC_API_KEY가 있어도 Anthropic을 부르지 않고, 웹은 앱 규칙 안내로 답합니다." ;;
                no_key) echo "- ⚠️ AI 상담 함수가 로그인을 확인할 서버 키를 찾지 못했습니다 — 개발자에게(설정 안내 B-4)." ;;
                *) echo "- ⚠️ AI 상담 함수의 로그인 확인을 하지 못했습니다 — Edge Functions → chat → Logs 확인." ;;
              esac
              # 이름:함수 기본값(supabase/functions/_shared/chat.ts) — 비어 있으면 서버에 이미 있던 값이 남고, 처음이면 기본값. 숫자만 적는다.
              limits=""
              for pair in CHAT_HOURLY_LIMIT:10 CHAT_GUEST_HOURLY_LIMIT:5 CHAT_GLOBAL_HOURLY_LIMIT:60 CHAT_GLOBAL_DAILY_LIMIT:500; do
                name="${pair%%:*}"
                v="${!name:-}"
                v="${v//[^0-9]/}"
                if [ -n "${v}" ]; then
                  limits="${limits} \`${name}=${v}\`"
                else
                  limits="${limits} \`${name}\`(비어 있음 - 서버 값 유지, 처음이면 기본 ${pair##*:})"
                fi
              done
              echo "- AI 상담 한도(Variables):${limits}. 게스트 한도는 한 사람 한도까지만 쓰고, 함수 Logs의 시작 줄 \`limits\`에서 실제 값을 봅니다."
              echo "- 웹 사이트는 이 워크플로가 바꾸지 않습니다. 사이트 설정(NEXT_PUBLIC_*)을 바꿨다면 Actions → Deploy to GitHub Pages → Run workflow."
            else
              echo "- 중간에 실패했습니다. 빨간 ✗ 단계의 메시지와 docs/dev/SUPABASE_SETUP.md \"I. 문제 해결\"을 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
