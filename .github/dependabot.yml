# 의존성 업데이트 PR — 매주 월요일 아침(한국 시간). 보안 패치는 이와 별도로 저장소 Settings → Advanced Security의
# Dependabot security updates가 켜져 있으면 바로 온다(아래 cooldown은 보안 업데이트에는 걸리지 않는다).
# - npm: minor·patch는 PR 하나로 묶고, major(예: next 17)는 따로 — 함께 고칠 코드가 있을 수 있어서. 열린 PR은 5개까지.
# - GitHub Actions(.github/workflows): 같은 방식. 커밋으로 고정한 액션(supabase/setup-cli)은 커밋과 버전 주석을 함께 올린다.
#   setup-cli의 `version:`(CLI 버전)은 Dependabot이 올리지 않는다 — supabase.yml·health-check.yml에서 손으로 함께.
# - 나온 지 7일이 안 된 판은 기다린다(cooldown) — 배포 직후 회수되는 판·공급망 사고를 피하려고.
# PR을 main에 합치면 deploy.yml이 타입 검사·린트·테스트·빌드·브라우저 시험을 거친 뒤에만 배포한다(실패하면 지금 사이트가 그대로 남음).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # 아직 올리지 않는 major(2026-10-24 확인) — 조건이 풀리면 이 줄을 지운다.
    # - typescript 7: typescript-eslint가 typescript <6.1만 지원
    # - eslint 10: eslint-config-next가 묶은 플러그인 일부가 eslint 10을 peer로 아직 받지 않음(설치가 peer를 덮어씀)
    # - @types/node: CI·배포가 Node 24라 타입도 24에 맞춘다(새 Node 전용 API를 잘못 쓰지 않게)
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
